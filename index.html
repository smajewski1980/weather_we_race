<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Weather We Race</title>
    <link
      rel="stylesheet"
      href="styles.css"
    />
    <link
      rel="shortcut icon"
      href="favicon.ico"
      type="image/x-icon"
    />
    <script
      src="./script.js"
      type="module"
      defer
    ></script>
  </head>

  <body>
    <h1>Weather We Race</h1>

    <p class="weather-attr">
      Weather by&nbsp;
      <a
        href="https://open-meteo.com/"
        target="_blank"
      >
        Open-Meteo.com
      </a>
    </p>

    <main>
      <div class="cards-wrapper">
        <section id="next-cup-race">
          <div class="card">
            <div class="cup-off-week-msg">NO RACE<br />THIS WEEK</div>
            <img
              src="./assets/card.svg"
              alt=""
            />
            <img
              class="track-main"
              src=""
              alt="racetrack photo"
            />
            <img
              src=""
              alt="track logo"
              class="track-logo"
            />
            <p class="goog-atr">Google Maps is a trademark of Google LLC.</p>
          </div>
        </section>

        <hr />

        <section id="next-oreilly-race">
          <div class="card">
            <img
              src="./assets/card.svg"
              alt=""
            />
            <div class="decor-flag"></div>
            <img
              class="track-main"
              src=""
              alt="racetrack photo"
            />
            <img
              src=""
              alt="track logo"
              class="track-logo"
            />
            <div class="track-facts"></div>
          </div>
        </section>
      </div>

      <section class="weather-section">
        <!-- cup series -->
        <div
          class="info-wrapper"
          id="next-cup-race"
        >
          <div class="race-info-wrapper">
            <div class="label-wrapper">
              <img
                src="./assets/cup_logo_sm.webp"
                alt="nascar cup series"
                id="cup-logo-sm"
                class="logo-sm"
              />
              <h2>NEXT RACE:</h2>
            </div>
            <p class="date"></p>
            <p class="race-name"></p>
            <p class="track-name"></p>
            <p class="track-info"></p>
          </div>

          <div class="cup-weather-info-wrapper">
            <h3>GREEN FLAG:</h3>
            <span id="cup-weather-span"></span>

            <p>
              🌡️<span id="cup-temp-span"></span> &nbsp;&nbsp;💧
              <span id="cup-precip-span"></span>&nbsp;&nbsp;🌥️
              <span id="cup-cloud-span"></span>
            </p>

            <p>
              Wind: <span id="cup-wind-spd-span"></span> &nbsp;&nbsp;Gusts:
              <span id="cup-wind-gst-span"></span>
            </p>
          </div>
        </div>
        <hr />

        <!-- oreilly -->
        <div
          class="info-wrapper"
          id="next-oreilly-race"
        >
          <div class="race-info-wrapper">
            <div class="label-wrapper">
              <img
                src="./assets/oreilly_logo_sm.webp"
                alt="nascar oreilly auto parts series"
                id="oreilly-logo-sm"
                class="logo-sm"
              />
              <h2>NEXT RACE:</h2>
            </div>
            <p class="date"></p>
            <p class="race-name"></p>
            <p class="track-name"></p>
            <p class="track-info"></p>
          </div>

          <div class="oreilly-weather-info-wrapper">
            <h3>GREEN FLAG:</h3>
            <span id="oreilly-weather-span"></span>
            <p>
              🌡️<span id="oreilly-temp-span"></span> &nbsp;&nbsp;💧
              <span id="oreilly-precip-span"></span> &nbsp;&nbsp;🌥️
              <span id="oreilly-cloud-span"></span>
            </p>
            <p>
              Wind: <span id="oreilly-wind-spd-span"></span> &nbsp;&nbsp;Gusts:
              <span id="oreilly-wind-gst-span"></span>
            </p>
          </div>
        </div>
        <hr />

        <!-- trucks -->
        <div
          class="info-wrapper"
          id="next-truck-race"
        >
          <div class="race-info-wrapper">
            <div class="label-wrapper">
              <img
                src="./assets/craftsman_logo_sm.webp"
                alt="nascar craftsman truck series"
                id="cr-truck-logo-sm"
                class="logo-sm"
              />
              <h2>NEXT RACE:</h2>
            </div>
            <p class="date"></p>
            <p class="race-name"></p>
            <p class="track-name"></p>
            <p class="track-info"></p>
          </div>

          <!-- <hr /> -->

          <div class="truck-weather-info-wrapper">
            <h3>GREEN FLAG:</h3>
            <span id="truck-weather-span"></span>
            <p>
              🌡️<span id="truck-temp-span"></span> &nbsp;&nbsp;💧
              <span id="truck-precip-span"></span> &nbsp;&nbsp;🌥️
              <span id="truck-cloud-span"></span>
            </p>
            <p>
              Wind: <span id="truck-wind-spd-span"></span> &nbsp;&nbsp;Gusts:
              <span id="truck-wind-gst-span"></span>
            </p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
